  #
  # So the mechanism is now exercised end to end and terminates honestly at
  # the one thing still missing. See the dr-3msk6.3 and dr-c3wos bd comments
  # for the full state and what dr-3msk6.8 (readback-before-post) needs next.
  #
  # CLOSED 2026-08-18 (dr-3msk6.1, mail/nudge half) — the second entry above.
  # The Slack comment's "that half is a separate, still-blocked prerequisite
  # ... and must keep raising until it is actually fixed" is now discharged,
