  #    agent_mail_nudge."; after: [] ]
  #
  # bin/nudge-state-reconciler (dr-3msk6.1) makes nudge delivery state
  # readable. A nudge leaves `pending` in .gc/nudges/state.json when it is
  # delivered, so bucket membership IS the delivery signal; the reconciler
