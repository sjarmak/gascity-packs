  # report groups on `source` and not only on target.
  #   - 1 x DEAD_LETTERED -> gascity-pl via `sling`: real work direction
  #     ("Work slung. Check your hook.", bead dr-wisp-8br) that expired
  #     undelivered after 51h. A bead was dispatched and its seat never heard.
  #   - 40 x TARGET_NOT_LIVE -> geo/oversight-rig.project-lead via `session`:
  #     Slack channel-binding reminders for C0123ROOM01, queued over 21h to a
  #     session (gc-795775) that is `asleep` on a rig suspended under dec-nyej.
  #     Context injection rather than work direction, and still loss: a bound
  #     channel accrues reminders for a seat that cannot answer.
  # Every one of the 40 carries `last_error: null` — the queue does not consider
  # them failed, and before this order nothing said otherwise. Same shape as the
  # 67 undelivered nudges CLAUDE.md records, still accumulating. An earlier
  # draft of this entry called all 41 "work direction"; the messages say
  # otherwise, and the correction is what added the source dimension.
  #   [2026-08-18T19:28Z; bin/nudge-state-reconciler --no-report]
  #   [2026-08-18T19:44Z; python3 -c "import json,collections; d=json.load(open(
  #    '.gc/nudges/state.json')); print(collections.Counter((b, r.get('source'))
  #    for b in ('pending','dead') for r in d.get(b,[])))" ]
  #
  # Cross-family review: one round, codex-review --model spark (gpt-5.6-sol is
  # rate-limited until ~Aug 19 23:30). Two real defects, both fixed and both now
  # mutation-proved: a non-mapping row in `gc session list --json` crashed
  # index_sessions with an AttributeError before any report was emitted, and a
  # queue of nothing but malformed rows reported total_records=0 and exited 0 —
  # a clean bill of health for an unreadable queue. Malformed rows are now
  # counted and reported as MALFORMED_RECORD, and a partly-parseable registry
  # reads as unread rather than partial. 18 seeded mutations, 17 go red; the
  # 18th (dropping the nanosecond-fraction trim in parse_timestamp) is stated in
  # the test as uncoverable on CPython 3.12, which accepts fractions of any
  # length, rather than papered over.
  #
  # NOT OVERCLAIMING: this reads the SENDER-side queue, not the receiver. It
  # proves a nudge left the queue, not that the seat acted on the text — the
  # receiver-side proof is dispatch-delivery-canary, disabled since 08-14 and
  # noted at the head of this section. It also cannot distinguish a nudge
  # backing off from one backing off forever from one reading; DEFERRED is
  # counted, not reported, and the age rail catches the forever case only once
  # the record outlives the stale limit. And it deliberately does NOT report
  # via `gc nudge`: reporting a dropped nudge through the nudge channel is the
  # failure it exists to measure. The durable output is
  # .gc/reports/nudge-state-reconciler/latest.json; exit 2 (queue unreadable)
  # is kept distinct from exit 0 so an unread channel can never present as a
  # clean one.
  #
  # CLOSED 2026-08-18 (dr-3msk6.2) — was: "nothing re-reads the code host for
  # BASE identity. PR #4827 sat at behind_by=290 with ahead_by=4 and
  # mergeable=MERGEABLE for nine days; GitHub's mergeability is textual and
  # carries no base identity, and no rollup row carries the base SHA the run
  # was evaluated against. A human reading job logs is the entire detection
  # mechanism."
  #   [2026-08-16T14:37Z; gh api repos/gastownhall/gascity/compare/main...
  #    3d3176a270a00d7a43a892589be949829da483fd --jq '{ahead_by,behind_by}']
  #
  # bin/pr-state-poller now re-reads, every 15m per open PR we authored on
  # gastownhall/{gascity,gascity-packs}: head SHA, base SHA (resolved via
  # `gh api repos/<repo>/branches/<baseRefName> --jq .commit.sha` — gh's
  # `pr view --json` has no baseRefOid field, only baseRefName, a branch
  # name; confirmed live 2026-08-18 against gh 2.45.0), mergeable,
  # mergeStateStatus, a check-status summary, and ahead_by/behind_by (same
  # compare-API shape as the citation above, base resolved to a SHA rather
  # than a moving branch name). Persisted under code_host_state in
  # .gc/pr-state-cache/<repo>-<pr>.json; raises (`gc mail send mayor`, the
  # bin/pr-merge-notifier idiom) on: behind_by over threshold (default 20,
  # env PR_STATE_POLLER_BEHIND_THRESHOLD) for 2 consecutive polls — not 1,
  # to avoid alerting on a single noisy sample; mergeable flipping
  # MERGEABLE->CONFLICTING; mergeable reading UNKNOWN for 2+ consecutive
  # polls with no head-SHA change in between (a single UNKNOWN right after a
  # push is GitHub's normal async computation, not a signal); and base_sha
  # changing between polls while behind_by does not simultaneously trend
  # toward zero. 24h re-raise suppression per (repo, pr, condition),
  # tracked in the same cache file. Read-only: never pushes, merges,
  # closes, or comments on a PR. Runs and persists unconditionally on
  # --dry-run — the live order (orders/pr-state-poller.toml) runs this
  # script under --dry-run permanently under a 2026-08-11 hold that scopes
  # to *dispatching iterate work*, not to observing PR state, so this path
  # had to be independent of that flag to run in production at all.
  # Verified against live data, not just stubs, on gastownhall/gascity #5276
  # (human-authored, currently open): behind_by=44, mergeable=MERGEABLE,
  # raised behind_by_threshold on the 2nd consecutive poll as designed.
  #   [2026-08-18T13:18:20Z; GC_STORE_ROOT=<scratch> bash bin/pr-state-poller
  #    --dry-run --pr 5276 (run twice); .gc/pr-state-cache/gastownhall-
  #    gascity-5276.json code_host_reconcile.raised_conditions.
  #    behind_by_threshold set; .gc/pr-state-poller.log event=reconcile_raised]
  #
  # Remaining gap, stated plainly rather than folded into "closed": checks_
  # summary (total/passing/failing/pending from statusCheckRollup) is
  # captured and cached every poll, but no condition here raises on a
  # check-status FLIP (e.g. green -> red after the PR was already read as
  # clean). That is a narrower, still-open instance of this same WARN —
  # RECON-001 is closed for base/mergeable drift, not for every code-host
  # fact a PR carries.
  #
  # ABSENT, each an explicit finding rather than an omission:
  #   - no entry re-reads mail/nudge delivery receipts. UPDATED 2026-08-18
  #     (dr-3msk6.3): the Slack half of this is now covered by the
  #     slack_publish_delivery entry above — genuinely, but not yet live
  #     (mechanism built and tested, adapter-side marker emission still an
  #     uncommitted gascity-packs diff; see that entry's comment for the
  #     precise state). The mail/nudge half remains fully absent and
  #     unstarted, blocked on dr-3msk6.1 (nudge identity prerequisite).
  #   - no `running_session` / resolve_session_for_current_claim entry, so a
  #     retry cannot start-or-attach and can only launch blind
  #   - no reconciler is scheduled for a dead formula run. 416 live step beads
  #     exist; 54 sit under 11 roots ALREADY CLOSED; 153 carry no
  #     gc.root_bead_id at all and are unreachable by any reconciler by
  #     construction. The autoclose that would cover the 11 returns early on
  #     `mol.Type != "molecule"` (cmd/gc/molecule_autoclose.go:169-171) and all
  #     11 are issue_type=task with gc.kind=workflow.

# Capacity is per-pool (min_active_sessions / max_active_sessions per agent)
# with a session-create budget. There is no class partition: no recovery class
# with a decided numeric maximum, no reserved interactive capacity, no declared
# fairness levels. Budgets that DO exist bound wakes per tick (15), pool session
# creates per tick (15) and order dispatches per tick (4) — all of them seat
# admission, none of them work re-attempts.
#
# `classes` is omitted rather than declared with a guess, because the retry
# storm the class partition exists to bound is present in code and unbounded:
#
#   - NINE independent retry owners, each with its own ceiling and none reading
#     another's: dispatch retry-eval, the ralph controller, nudge-queue
#     redelivery, idle-claim nudge, the session reconciler, the order
#     dispatcher, Temporal activity retry, completion-reconciler requeue, and
#     close-gate-reaper reopen (which has no attempt counter at all).
#   - ZERO jitter anywhere in the city, and backoff in exactly one layer.
#     internal/dispatch/retry.go does not import `time`; appendRetryAttempt
#     writes the next attempt with no scheduled-at and no delay, so it is ready
#     the instant it is written. The only spacing is the 2m controller tick, an
#     incidental floor rather than a policy.
#     [cd <gascity checkout> && grep -n 'time\.' internal/dispatch/retry.go]
#   - The ceilings COMPOSE MULTIPLICATIVELY because they live in separate
#     namespaces. gc.max_attempts (dispatch) and gc.completion_recovery_attempts
#     (the reconciler) are independent counters; the reconciler requeues by
#     setting --status open --assignee "", which resets nothing the dispatch
#     counter can see. Up to NINE executions of one work item, with no layer
#     able to report that number.
#   - The one layer with correct exponential backoff is Temporal, and it is in
#     shadow mode and executes nothing.
#   - The spawn-storm detector is disabled at city.toml:1983-1984, and even when
#     live it mailed the mayor rather than refusing anything. The guards that do
#     work (crash tracker, circuit breaker) bound SEAT restarts, never WORK
#     re-attempts.
#
# One favorable property, recorded because it cuts the other way: a failed order
# does not retry, since the cooldown arms off the tracking bead's CreatedAt with
# no outcome filter. One amplifier removed, at the price that order execution
# failures are silently dropped with no retry and no dead-letter.
scheduling:
  capacity: { total: 1 }             # workspace.max_active_sessions during the one-seat pause

# These measurements are the reason code_estate was OMITTED from 2026-08-16 to
# 2026-08-19, and they are kept rather than deleted because the declaration
# added below is narrower than they are: campaign work now pins a revision,
# and everything measured here still does not. Confirmed by direct
# measurement, not assumed: NO planned_base / base_revision / base_sha /
# merge_base is recorded at bead creation, at `gc sling` dispatch, at formula
# materialization, or at worktree creation. The issues schema has
# source_repo varchar(512) and no revision column at all.
# [2026-08-16T14:50Z; dolt --host 127.0.0.1 --port 29620 --user root --no-tls
#  --password '' sql -q "use gascity; describe issues;"]
# [2026-08-16T14:44Z; grep -rn --include="*.go" -E
#  "base_revision|base_sha|baseRev|baseSHA|BaseRevision|BaseSHA"
#  <gascity checkout>]  -> only an unrelated path-classifier test fixture
#
# What IS recorded describes the RESULT, not the starting point, and is
# near-vacuous: of beads closed since 2026-07-01, gc.work_commit is set on
# 10 of 2870 in gascity (0.35%) and 7 of 809 in the dr- store. The close gate
# that consumes it (cmd/gc/work_record_gate.go:117-158) is warn-only;
# GC_WORK_RECORD_ENFORCE is unset everywhere.
#
# And the branch identity it consumes is itself corrupt on 460 beads:
# 391 record gc.work_branch=pl-shared-checkout (201 behind origin/main) and
# 69 record _pr1945_check (2472 behind, last commit 2026-05-11). The gate asks
# "is my commit on my branch" and never "is my branch current".
# 404 of 405 worktrees are behind origin/main, median 298 commits.

code_estate:
  # Declared 2026-08-19 because a mechanism now earns it, and NOT before. The
  # note this replaces recorded that nothing in this city pins a starting
  # revision -- still true of `gc sling`, of formula materialization, and of
  # worktree creation, all measured below and unchanged. What changed is that
  # CAMPAIGN work, the only thing CODE-000 is asked about, now pins one.
  #
  # bin/campaign-estate records a campaign as (repository, revision, predicate,
  # TARGETS) and re-runs the predicate against `git archive <revision>`
  # extracted to a temp directory -- never against the working tree, which would
  # measure whatever is on disk and file it under a revision nobody verified.
  # bin/campaign-estate-records.test rechecks every record in campaigns/ on
  # each city-selftest run, which is what keeps this from being a sentence.
  #
  # It closes exactly defect 1 named under `campaigns:` below: completion
  # re-derives from the BEAD GRAPH and never re-executes discovery over
  # repository state, so a target that appears in the world after
  # materialization never gets a member. The recheck re-executes discovery and
  # exits 1 naming the unenrolled targets.
  #
  # Targets are stored as a LIST, never a count: two converted and two appeared
  # leaves the count identical and is the finding a campaign recheck exists for.
  # A predicate that exits nonzero is REFUSED rather than recorded as zero
  # targets, because grep exits 1 on no matches and an empty census is the shape
  # that makes every later recheck pass.
  #
  # First record, and it carries a real 17-member set rather than a fixture:
  # campaigns/slack-publish-fenced-routing.json, pinned to
  # gas-city@1272a78b, every bin/ caller of `gc slack publish-to-channel`.
  # [2026-08-19T06:4xZ; `bin/campaign-estate recheck --record
  #  campaigns/slack-publish-fenced-routing.json` -> exit 0, reproduces;
  #  `bash bin/campaign-estate-records.test` -> 1 passed]
  #
  # What this does NOT claim, so the declaration is not read wider than it is:
  # bead work outside a campaign record still pins nothing. gc.work_commit is
  # still set on 10 of 2870 closed gascity beads, its close gate is still
  # warn-only, and 460 beads still record a corrupt branch identity. Those
  # measurements are unchanged and are kept below.
  canonical_identity: "repository@revision"
  # topology_provider and in_flight_manifest stay UNDECLARED. Both have a
  # plausible candidate here -- codegraph answers structural questions, and the
  # worktree registry lists in-flight work -- and neither is wired to campaign
  # discovery, so declaring them would be exactly the unearned declaration this
  # block was omitted to avoid. Discovery today is a shell predicate against a
  # materialized revision, which is honest about being textual.
campaigns:
  # Completion re-derives its member set live rather than counting a remembered
  # child list (molecule_autoclose.go:227-245 -> molecule.ListSubtree), which is
  # a better shape than the kit's unsafe control. Two things defeat it, so this
  # is declared as the narrow property it actually holds:
  #   1. The re-derived set is the BEAD GRAPH, never a re-executed discovery
  #      predicate over repository state. The kit's discover(intent,
  #      current_state) step has no implementation, so a target that appears in
  #      the world after materialization never gets a child.
  #   2. It is one-directional: it closes a root when the subtree is terminal,
  #      and NOTHING refuses a root close while the subtree is live. Measured:
  #      11 closed roots with 54 live steps under them, closes spanning
  #      2026-08-05 to 2026-08-14.
  completion:
    all_current_targets_have_disposition:
      - published

# Which lifecycle transitions this city claims to WATCH, and the threshold each
# one is watched against. Read by bin/lifecycle-latency-watch, which exits
# non-zero when a promise here is breached, has no objective, or cannot be
# measured at all. That last rail is why this list is short.
#
# `ready_to_claim` was declared here from 2026-08-16 and is WITHDRAWN, not
# demoted. Nothing in this city records a ready timestamp, so no transition
# computes it, and the nearest candidate (created_at -> gc.claimed_at) starts at
# creation: a bead can sit non-ready for days after it is cut, so measuring from
# there would report a queue-wait as a claim-latency and would be wrong in the
# direction that looks fine. A promise with nothing behind it is an overclaim in
# our own contract, which is the exact defect this audit exists to find. It goes
# back when something emits the timestamp, not before.
#
# Four of the six canonical transitions stay unpromised for the same reason:
# `gc.claimed_at` and `gc.verified_at` are written by nothing today, so
# created_to_claimed, claimed_to_started, completed_to_verified and
# verified_to_published are all uncomputable. That keeps OBS-001 a WARN (the
# rule wants all six) and the WARN is accurate. Emission is tracked on
# dr-3msk6.7 and dr-3msk6.9; refute the coverage claim with
# `bin/lifecycle-transition-coverage` (exit 1, and it names the missing key).
#
# The two objectives below are REGRESSION thresholds, not a claim that the
# current numbers are good. Each is set with headroom over the measured p90 so
# the watch fires on a material worsening rather than on ordinary variance, and
# so it cannot be a guard fitted so tightly to today's data that it is green by
# construction. Measured 2026-08-19 over 1675 beads
# [`bin/lifecycle-transition-coverage`]:
#   started_to_progress        p50 2.2h   p90 3.0d    -> objective p90 4d
#   published_to_acknowledged  p50 35m    p90 25.8h   -> objective p90 36h
# Tighten them when the underlying latency improves; a threshold that has never
# been moved down is a threshold nobody is reading.
observability:
  promises:
    - started_to_progress
    - published_to_acknowledged
  objectives:
    started_to_progress:
      p90: 4d
    published_to_acknowledged:
      p90: 36h
